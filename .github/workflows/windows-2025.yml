name: Windows (Server 2025)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel $env:NUMBER_OF_PROCESSORS

      - name: Inspect binary
        run: |
          Get-Item build/app/HDMapping-SearchAndRescue.exe | Format-List FullName, Length, LastWriteTime

      - name: Upload binary artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: HDMapping-SearchAndRescue-windows-2025
          path: build/app/HDMapping-SearchAndRescue.exe
          if-no-files-found: error

