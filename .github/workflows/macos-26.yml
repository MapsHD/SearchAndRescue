name: macOS (Tahoe 26)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.build_type }})
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel $(sysctl -n hw.ncpu)

      - name: Inspect binary
        run: |
          ls -lh build/app/HDMapping-SearchAndRescue
          file build/app/HDMapping-SearchAndRescue
          otool -L build/app/HDMapping-SearchAndRescue

      - name: Upload binary artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: HDMapping-SearchAndRescue-macos-26
          path: build/app/HDMapping-SearchAndRescue
          if-no-files-found: error

